<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnGuard AI — Security & Vulnerability Report</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --critical: #ef4444;
            --high: #f97316;
            --medium: #eab308;
            --low: #3b82f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            border-bottom: 2px solid var(--surface-card);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; color: var(--accent); font-size: 2rem; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .stat-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--surface-card);
            text-align: center;
        }
        .stat-value { font-size: 2.5rem; font-weight: bold; margin-bottom: 0.25rem; }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-CRITICAL { background: var(--critical); color: #fff; }
        .badge-HIGH { background: var(--high); color: #fff; }
        .badge-MEDIUM { background: var(--medium); color: #000; }
        .badge-LOW { background: var(--low); color: #fff; }
        .finding-card {
            background: var(--surface);
            border-radius: 0.75rem;
            border: 1px solid var(--surface-card);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .finding-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .code-snippet {
            background: #00000040;
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: auto;
            border-left: 4px solid var(--accent);
            margin: 1rem 0;
        }
        .remediation {
            background: #05966920;
            border: 1px solid #059669;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>VulnGuard AI Report</h1>
                <p style="color: var(--text-muted); margin-top: 0.5rem;">Hybrid Static Analysis & AI Security Audit</p>
            </div>
            <div>
                <span style="font-size: 0.9rem; color: var(--text-muted);">Scan Date: 2026-07-24 20:52:04</span>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" style="color: var(--accent);">0</div>
                <div>Total Findings</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--critical);">0</div>
                <div>Critical Severity</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--high);">0</div>
                <div>High Severity</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--medium);">0</div>
                <div>Medium Severity</div>
            </div>
        </div>

        <h2>Detailed Findings</h2>
        
        <p style="color: var(--text-muted);">No vulnerabilities detected during this scan.</p>
        

        
    </div>
</body>
</html>
